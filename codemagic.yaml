workflows:
  seif-tv-android:
    name: Seif TV Android APK
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Check source archive
        script: |
          echo "=== Files ==="
          ls -lah
          echo "=== ZIP check ==="
          file SeifTV-Android-Source.zip || true
          unzip -t SeifTV-Android-Source.zip

      - name: Extract project
        script: |
          rm -rf SeifTV-FINAL-Android-Project
          mkdir -p SeifTV-FINAL-Android-Project
          unzip -q SeifTV-Android-Source.zip -d SeifTV-FINAL-Android-Project
          echo "=== Extracted ==="
          find SeifTV-FINAL-Android-Project -maxdepth 2 -type f | head -50

      - name: Build APK
        script: |
          cd SeifTV-FINAL-Android-Project
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - SeifTV-FINAL-Android-Project/app/build/outputs/apk/debug/*.apk
